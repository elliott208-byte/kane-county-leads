name: Kane County Lead Scraper

on:
  schedule:
    # Run daily at 7:00 AM UTC (2:00 AM Central)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back days (default: 7)"
        required: false
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & Enrich
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml dbfread playwright
          pip install -r scraper/requirements.txt || true

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          LOOK_BACK_DAYS: ${{ github.event.inputs.days || '7' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scraper/fetch.py

      - name: Commit updated records
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/records.json data/records.json data/ghl_export.csv || true
          git diff --staged --quiet || git commit -m "chore: update records $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload GHL export artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghl-export-${{ github.run_id }}
          path: data/ghl_export.csv
          retention-days: 30

  deploy:
    name: Deploy Dashboard to GitHub Pages
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
