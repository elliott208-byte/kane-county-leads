<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kane County Motivated Seller Leads</title>
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --border: #2a2d3e;
      --accent: #6c63ff; --green: #4ade80; --yellow: #facc15;
      --red: #f87171; --text: #e2e8f0; --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header span.badge { background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; }
    .controls { padding: 1rem 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; background: var(--card); border-bottom: 1px solid var(--border); }
    .controls input, .controls select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.875rem; }
    .controls input { width: 220px; }
    .stats { display: flex; gap: 1rem; padding: 1rem 2rem; flex-wrap: wrap; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1.4rem; min-width: 130px; }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 2px; }
    .table-wrap { padding: 0 2rem 2rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead th { background: var(--card); border-bottom: 2px solid var(--border); padding: 0.6rem 0.75rem; text-align: left; white-space: nowrap; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
    thead th:hover { color: var(--text); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--card); }
    td { padding: 0.55rem 0.75rem; vertical-align: top; }
    .score-bar { display: flex; align-items: center; gap: 6px; }
    .score-pill { border-radius: 999px; padding: 1px 9px; font-weight: 700; font-size: 0.78rem; }
    .score-high { background: #16a34a22; color: var(--green); }
    .score-mid  { background: #ca8a0422; color: var(--yellow); }
    .score-low  { background: #dc262622; color: var(--red); }
    .flag { display: inline-block; background: var(--accent)22; color: var(--accent); border-radius: 4px; padding: 1px 6px; font-size: 0.7rem; margin: 1px; white-space: nowrap; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .fetched { font-size: 0.75rem; color: var(--muted); margin-left: auto; }
    .empty { text-align: center; padding: 4rem; color: var(--muted); }
    @media (max-width: 640px) {
      header, .controls, .stats, .table-wrap { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>
<header>
  <h1>&#127968; Kane County Motivated Seller Leads</h1>
  <span class="badge" id="totalBadge">0</span>
  <span class="fetched" id="fetchedAt"></span>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Search owner, address, doc#…" />
  <select id="catFilter">
    <option value="">All Categories</option>
    <option value="foreclosure">Foreclosure</option>
    <option value="judgment">Judgment</option>
    <option value="lien">Lien</option>
    <option value="tax">Tax</option>
    <option value="probate">Probate</option>
    <option value="construction">Construction</option>
    <option value="release">Release</option>
  </select>
  <select id="minScore">
    <option value="0">Any Score</option>
    <option value="50">50+</option>
    <option value="60">60+</option>
    <option value="70">70+</option>
    <option value="80">80+</option>
  </select>
  <button onclick="exportCSV()" style="background:var(--accent);color:#fff;border:none;padding:0.4rem 1rem;border-radius:6px;cursor:pointer;font-size:0.85rem;">
    &#11015; Export CSV
  </button>
</div>

<div class="stats">
  <div class="stat-card"><div class="label">Total Leads</div><div class="value" id="sTotal">—</div></div>
  <div class="stat-card"><div class="label">With Address</div><div class="value" id="sAddr">—</div></div>
  <div class="stat-card"><div class="label">Avg Score</div><div class="value" id="sAvg">—</div></div>
  <div class="stat-card"><div class="label">High Score (70+)</div><div class="value" id="sHigh">—</div></div>
  <div class="stat-card"><div class="label">Foreclosure</div><div class="value" id="sFc">—</div></div>
  <div class="stat-card"><div class="label">Date Range</div><div class="value" id="sRange" style="font-size:0.9rem">—</div></div>
</div>

<div class="table-wrap">
  <table id="leadsTable">
    <thead>
      <tr>
        <th onclick="sortBy('score')">Score &#8597;</th>
        <th onclick="sortBy('filed')">Filed &#8597;</th>
        <th onclick="sortBy('cat_label')">Type</th>
        <th onclick="sortBy('owner')">Owner / Grantor</th>
        <th>Property Address</th>
        <th onclick="sortBy('amount')">Amount &#8597;</th>
        <th>Flags</th>
        <th>Doc #</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none">No records match your filters.</div>
</div>

<script>
let allRecords = [];
let sortCol = 'score';
let sortDir = -1;

async function init() {
  try {
    const r = await fetch('./records.json?_=' + Date.now());
    const data = await r.json();
    allRecords = data.records || [];
    document.getElementById('fetchedAt').textContent =
      data.fetched_at ? 'Updated: ' + new Date(data.fetched_at).toLocaleString() : '';
    document.getElementById('sRange').textContent =
      (data.date_range?.from || '?') + ' – ' + (data.date_range?.to || '?');
    renderStats(allRecords);
    render();
  } catch(e) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:2rem">'+
      'No data yet – run the scraper to populate records.</td></tr>';
  }
}

function renderStats(recs) {
  document.getElementById('sTotal').textContent = recs.length;
  document.getElementById('sAddr').textContent = recs.filter(r => r.prop_address).length;
  const avg = recs.length ? Math.round(recs.reduce((s,r) => s + (r.score||0), 0) / recs.length) : 0;
  document.getElementById('sAvg').textContent = avg;
  document.getElementById('sHigh').textContent = recs.filter(r => (r.score||0) >= 70).length;
  document.getElementById('sFc').textContent = recs.filter(r => r.cat === 'foreclosure').length;
  document.getElementById('totalBadge').textContent = recs.length;
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const minSc = parseInt(document.getElementById('minScore').value) || 0;
  return allRecords.filter(r => {
    if (cat && r.cat !== cat) return false;
    if ((r.score||0) < minSc) return false;
    if (q) {
      const hay = [r.owner,r.doc_num,r.prop_address,r.mail_address,r.legal].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const recs = filtered().sort((a,b) => {
    let av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
    if (typeof av === 'number' || typeof bv === 'number') { av = +av||0; bv = +bv||0; }
    return av < bv ? sortDir : av > bv ? -sortDir : 0;
  });
  renderStats(recs);
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyMsg');
  if (!recs.length) { tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = recs.map(r => {
    const sc = r.score || 0;
    const scCls = sc >= 70 ? 'score-high' : sc >= 50 ? 'score-mid' : 'score-low';
    const addr = [r.prop_address, r.prop_city, r.prop_state, r.prop_zip].filter(Boolean).join(', ');
    const flags = (r.flags||[]).map(f => '<span class="flag">'+esc(f)+'</span>').join('');
    const amt = r.amount ? '$'+r.amount.toLocaleString() : '—';
    return `<tr>
      <td><span class="score-pill ${scCls}">${sc}</span></td>
      <td style="white-space:nowrap">${esc(r.filed||'')}</td>
      <td style="white-space:nowrap">${esc(r.cat_label||r.doc_type||'')}</td>
      <td><strong>${esc(r.owner||'')}</strong>${r.grantee?'<br><small style="color:var(--muted)">→ '+esc(r.grantee)+'</small>':''}</td>
      <td>${addr ? esc(addr) : '<span style="color:var(--muted)">—</span>'}</td>
      <td style="white-space:nowrap">${amt}</td>
      <td>${flags}</td>
      <td style="white-space:nowrap;font-size:0.75rem">${esc(r.doc_num||'')}</td>
      <td><a href="${esc(r.clerk_url||'#')}" target="_blank" rel="noopener">&#128279;</a></td>
    </tr>`;
  }).join('');
}

function sortBy(col) { sortDir = sortCol===col ? -sortDir : -1; sortCol = col; render(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function exportCSV() {
  const recs = filtered();
  const cols = ['score','filed','cat_label','doc_type','doc_num','owner','grantee','amount',
    'prop_address','prop_city','prop_state','prop_zip',
    'mail_address','mail_city','mail_state','mail_zip','flags','clerk_url'];
  const rows = [cols.join(',')].concat(recs.map(r =>
    cols.map(c => {
      let v = c==='flags' ? (r.flags||[]).join('; ') : (r[c]??'');
      return '"'+String(v).replace(/"/g,'""')+'"';
    }).join(',')
  ));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kane-leads-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('catFilter').addEventListener('change', render);
document.getElementById('minScore').addEventListener('change', render);

init();
</script>
</body>
</html>
